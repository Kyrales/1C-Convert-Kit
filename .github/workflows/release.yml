name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release version
        run: python3 scripts/validate_release_tag.py "$GITHUB_REF_NAME"

      - name: Prepare release notes
        run: python3 scripts/extract_release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "1C Convert Kit ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
